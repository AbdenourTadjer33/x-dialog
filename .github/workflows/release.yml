name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Open a release PR, or publish when it merges
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: "chore: release"
          commit-message: "chore: release"
        # Third-party actions are pinned to commit SHAs (Dependabot bumps them).
        # npm auth comes from setup-node's `registry-url` + NODE_AUTH_TOKEN.
        # After the first publish, prefer npm trusted publishing (OIDC) for this
        # workflow on npmjs.com and drop NODE_AUTH_TOKEN below.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
