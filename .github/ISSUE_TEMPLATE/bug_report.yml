name: Bug report
description: Something behaves differently from the docs.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest reproduction
      description: Code, or a link to a fork of the demo.
      render: tsx
    validations:
      required: true
  - type: dropdown
    id: primitive
    attributes:
      label: Primitive
      options: [Radix, Base UI, Custom frame]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "@x-dialog/react 0.1.0, React 19.2, radix-ui 1.8"
    validations:
      required: true
